<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своя кухня — игра про формы предпринимательства</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fbf4ef; --surface:#ffffff; --surface2:#fdeceb; --ink:#2a0b12; --muted:#7d4a54; --line:#3a0d17;
  --pink:#ff2f73; --pinkInk:#c1124f; --yellow:#ffd21f; --yel2:#fff3c4; --wine:#8e1b2e;
  --ok:#17845f; --okbg:#ddf5e8; --bad:#c8102e; --badbg:#ffe1e4;
  --drop:0 5px 0 rgba(58,13,23,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1d0a10; --surface:#2b1219; --surface2:#3a1821; --ink:#fff1ec; --muted:#d9b3ba; --line:#f0c4cb;
    --pinkInk:#ff8fb0; --yel2:#4a3a12; --wine:#ff8fb0; --ok:#5fe0b0; --okbg:#163b2f; --bad:#ff7e8e; --badbg:#4a1620;
    --drop:0 5px 0 rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d0a10; --surface:#2b1219; --surface2:#3a1821; --ink:#fff1ec; --muted:#d9b3ba; --line:#f0c4cb;
  --pinkInk:#ff8fb0; --yel2:#4a3a12; --wine:#ff8fb0; --ok:#5fe0b0; --okbg:#163b2f; --bad:#ff7e8e; --badbg:#4a1620;
  --drop:0 5px 0 rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Raleway,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;overflow:hidden}
.app{max-width:1180px;margin:0 auto;padding:10px 14px 12px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
button{font:inherit;color:inherit}
b{font-weight:800}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:none;min-width:0}
.hud #room{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:40vw}
.brand{font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:18px;margin-right:auto;display:flex;align-items:center;gap:8px;color:var(--wine)}
.brand svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;background:var(--surface)}
.chip,.hbtn{white-space:nowrap;flex:none}
.chip.stars{background:var(--yellow);color:#2a0b12;border-color:#3a0d17}
.hbtn{font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);color:var(--ink);cursor:pointer}
.hbtn:hover{background:var(--surface2)}
.hbtn[hidden]{display:none}
.saved{font-size:13px;color:var(--muted);font-weight:600;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* STAGE */
.stage{position:relative;width:100%;flex:1 1 auto;min-height:110px;border-radius:24px;overflow:hidden;border:1.5px solid var(--line);background:#c3c8ce;box-shadow:var(--drop)}
.stage.compact{min-height:84px}
.stage.hall{background:#f6ede4;container-type:size}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.blur svg.bg{filter:blur(3px) saturate(.85) brightness(.97)}
.char{position:absolute;bottom:1%;height:93%;transition:transform .45s ease,opacity .45s ease,filter .3s}
.char svg{height:100%;width:auto;display:block}
.char.left{left:5%}
.char.right{right:6%}
.char.hidden{opacity:0;transform:translateY(10%)}
.char.quiet{filter:saturate(.8) brightness(.94)}
.char.talk{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6%)}}
.char.jump{animation:jump .6s ease}
@keyframes jump{30%{transform:translateY(-7%)}60%{transform:translateY(0)}80%{transform:translateY(-2%)}}
.steam{transform-box:fill-box;transform-origin:center;animation:steam 3.2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}45%{opacity:.75}100%{opacity:0;transform:translateY(-16px)}}
.chip.streak{background:#fff;color:#c1124f;border-color:#c1124f}
.chip.streak.hot{background:#ff7a1a;color:#fff;border-color:#3a0d17;animation:flame 1s ease-in-out infinite}
@keyframes flame{50%{transform:scale(1.08)}}
.banner{position:absolute;left:50%;top:8%;transform:translateX(-50%);z-index:6;background:#2a0b12;color:#fff;font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:clamp(14px,2vw,22px);padding:10px 18px;border-radius:16px;border:2px solid #ffd21f;box-shadow:0 6px 0 #3a0d17;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;animation:bannerIn 2.6s ease forwards}
.banner.hot{background:#ff7a1a;border-color:#3a0d17}
.banner.jack{background:#ffd21f;color:#2a0b12;border-color:#3a0d17;font-size:clamp(15px,2.4vw,26px)}
.banner.cold{background:#4a2a31}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
.stage.slotstage{background:radial-gradient(circle at 50% 30%,#ffe6a8,#ff9e8f 55%,#8e1b2e)}
.slots{position:absolute;inset:6% 4%;display:flex;align-items:center;justify-content:center;gap:2%}
.cab{flex:0 1 760px;background:#8e1b2e;border:3px solid #3a0d17;border-radius:24px;padding:clamp(8px,1.6vw,18px);box-shadow:0 8px 0 #3a0d17;display:flex;flex-direction:column;gap:clamp(6px,1vw,12px);max-height:100%}
.sl-title{font-family:Unbounded,Raleway,sans-serif;font-weight:700;color:#ffd21f;text-align:center;font-size:clamp(15px,2.4vw,26px);text-shadow:0 2px 0 #3a0d17}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,1vw,12px)}
.reel{background:#fff;border:3px solid #3a0d17;border-radius:14px;min-height:clamp(70px,13vh,140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;box-shadow:inset 0 -10px 0 rgba(58,13,23,.08)}
.reel small{font-weight:800;color:#c1124f;font-size:clamp(10px,1.2vw,13px);text-transform:uppercase;letter-spacing:.04em}
.reel b{font-family:Unbounded,Raleway,sans-serif;color:#2a0b12;font-size:clamp(12px,1.7vw,19px);line-height:1.2;margin-top:4px}
.reel.spin b{filter:blur(1.5px);opacity:.7}
.sl-foot{text-align:center;color:#fff;font-weight:700;font-size:clamp(12px,1.3vw,15px)}
.lever{flex:none;width:clamp(28px,4vw,46px);height:clamp(120px,40%,230px);background:none;border:none;cursor:pointer;position:relative;padding:0}
.lever::before{content:"";position:absolute;left:42%;top:14%;bottom:0;width:16%;background:#c9cdd3;border:2px solid #3a0d17;border-radius:8px;transform-origin:50% 100%;transition:transform .25s}
.lever i{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;border-radius:50%;background:#ff2f73;border:3px solid #3a0d17;transition:transform .25s}
.lever.pull::before{transform:scaleY(.55) translateY(40%)}
.lever.pull i{transform:translateY(160%)}
.pop{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:clamp(20px,3.4vw,32px);color:#ffd21f;text-shadow:0 2px 0 #3a0d17,0 0 14px rgba(58,13,23,.4);pointer-events:none;animation:pop 1.1s ease forwards;z-index:4}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}

/* close-up guest */
.guestbox{position:absolute;right:4%;bottom:0;height:84%;display:flex;align-items:flex-end;gap:0;transition:filter .3s}
.guestbox svg{height:100%;width:auto;display:block}
.guestbox.pair svg{height:88%;margin-left:-9%}
.guestbox.pair svg:first-child{margin-left:0}
.guestbox.talk{animation:bob 1.3s ease-in-out infinite}
.guestbox.quiet{filter:saturate(.8) brightness(.94)}
.cloth{position:absolute;right:0;bottom:0;width:58%;height:20%;background:#fff;border-top:3px solid #3a0d17;border-left:3px solid #3a0d17;border-top-left-radius:18px}
.cloth::after{content:"";position:absolute;left:44%;top:0;bottom:0;width:13%;background:#ff2f73}
.cloth .prop{position:absolute;left:18%;top:-46%;font-size:clamp(26px,4.4vw,48px);font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.stage.compact .guestbox{height:96%}
.stage.compact .cloth{height:26%}

/* HALL */
.hallgrid{position:absolute;left:2%;right:2%;top:max(4%, calc(100% - 92cqh));bottom:2%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));column-gap:2%}
.spot{position:relative;border:none;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-height:0;min-width:0;transform-origin:50% 100%}
.spot.r0{transform:scale(.76)}
.spot.r1{transform:scale(.88)}
.spot .tag{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#2a0b12;border:2px solid #3a0d17;border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-size:clamp(10px,1.35vw,14px);white-space:nowrap;box-shadow:0 3px 0 #3a0d17;margin-bottom:4px;max-width:100%}
.spot .tag i{font-style:normal;background:#ff2f73;color:#2a0b12;border-radius:999px;padding:1px 8px;border:1.5px solid #3a0d17}
.spot .tag span{overflow:hidden;text-overflow:ellipsis;min-width:0;white-space:nowrap}
.spot .tag i{flex:none}
.spot .who{display:flex;align-items:flex-end;justify-content:center;height:56%;flex:none;margin-bottom:-6%;position:relative;z-index:0;width:100%}
.spot .who svg{height:100%;width:auto;max-width:60%}
.spot .who svg+svg{margin-left:-14%}
.spot .tbl{position:relative;width:46%;z-index:1}
.spot .tbl svg{width:100%;height:auto;display:block}
.spot .tbl .prop{position:absolute;left:18%;top:2%;transform:translate(-50%,-50%);font-size:clamp(16px,2.6vw,30px);font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.spot .done{position:absolute;top:-4px;right:12%;width:26px;height:26px;border-radius:50%;background:#17845f;color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid #3a0d17;font-size:14px}
.spot:hover .tag,.spot:focus-visible .tag{background:#ffd21f}
.spot.sel .tag{background:#ffd21f}
.spot:focus-visible{outline:none}
.spot:focus-visible .tbl{outline:3px solid #ff2f73;outline-offset:3px;border-radius:12px}
.spot.isdone .tag{background:#2fb98a;color:#fff;border-color:#0f5c43;box-shadow:0 3px 0 #0f5c43}
.spot.isdone .tag i{background:#fff;color:#0f5c43;border-color:#0f5c43}
.spot.isdone .tag::before{content:"✓";font-weight:900;margin-left:2px}
.spot.isdone .tbl .run{fill:#2fb98a}
.spot.isdone .tbl svg path:first-of-type{fill:#e6f8f0}
.spot .tag em{font-style:normal;flex:none;min-width:22px;height:22px;border-radius:50%;background:#ffd21f;border:1.5px solid #3a0d17;display:grid;place-items:center;font-size:12px}
.spot.locked .who,.spot.locked .tbl{filter:grayscale(.85) brightness(1.05);opacity:.7}
.spot.locked .tag{background:#f1e4de;color:#7d4a54}
.spot.locked .tag i{background:#e6d2cc}
.spot.next .tag{animation:glowTag 1.6s ease-in-out infinite}
@keyframes glowTag{50%{box-shadow:0 3px 0 #3a0d17,0 0 0 6px rgba(255,47,115,.35)}}

/* PANEL */
.panel{margin-top:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:16px 20px;flex:0 1 auto;min-height:0;max-height:58%;overflow:auto;overscroll-behavior:contain;box-shadow:var(--drop)}
.stage.compact + .panel{max-height:84%}
.panel > *{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.speaker{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:3px 12px;border-radius:999px;border:1.5px solid #3a0d17;background:var(--pink);color:#2a0b12;margin-bottom:10px}
.speaker.c{background:var(--yellow)}
.speaker.g{background:#ffb36b}
.speaker.w{background:#ff8fb0}
.speaker .av{width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid #3a0d17;overflow:hidden;display:inline-block;margin-left:-6px}
.speaker .av svg{width:100%;height:auto;margin-top:-2px}
.say{font-size:clamp(15px,calc(.7vw + 1.1vh),19px);line-height:1.5;max-width:76ch}
.term{color:var(--pinkInk);font-weight:800;border-bottom:2px dotted currentColor;cursor:help;outline:none}
.term:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:3px}
.gtip{position:fixed;z-index:80;background:#2a0b12;color:#fff;font-weight:600;font-size:14px;line-height:1.4;padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none}
.gtip[hidden]{display:none}
.ask{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-weight:600}
.ask .speaker{margin-bottom:0}
.ask.me{justify-content:flex-end;text-align:right}
.menuq{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:10px}
.mqh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--muted);margin-bottom:8px}
.dots5{display:flex;gap:5px}
.dots5 i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2)}
.dots5 i.on{background:var(--pink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.qbtn{font-weight:700;font-size:14.5px;text-align:left;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.qbtn:hover{background:var(--surface2)}
.qbtn.heard{background:var(--surface2)}
.qbtn.heard::before{content:"✓ ";color:var(--ok)}
.qbtn.cur{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}
.gloss{display:grid;grid-template-columns:1fr;gap:2px;margin:0}
.gloss dt{font-weight:800;color:var(--wine);margin-top:8px}
.gloss dd{margin:0;font-size:15.5px}
.term .tip-old{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:min(320px,80vw);background:#2a0b12;color:#fff;font-weight:600;font-size:14px;line-height:1.4;padding:10px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.term:hover .tip,.term:focus .tip{opacity:1}
.nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.nav .dots{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.nav .dots i{width:8px;height:8px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.nav .dots i.on{background:var(--pink)}
.arrow{width:48px;height:48px;border-radius:50%;border:1.5px solid #3a0d17;background:var(--yellow);color:#2a0b12;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #3a0d17;display:grid;place-items:center;flex:none}
.arrow:disabled{opacity:.35;cursor:default}
.arrow.back{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.row.end{justify-content:flex-end}
.btn{font-weight:800;font-size:16px;border:1.5px solid #3a0d17;background:var(--yellow);color:#2a0b12;border-radius:14px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 #3a0d17;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a0d17}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.title h1{font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:clamp(30px,5.4vw,52px);line-height:1.05;margin:0 0 10px;color:var(--wine)}
.title p{margin:0;color:var(--muted);max-width:62ch;font-weight:600}
.credit{margin-top:12px;color:var(--muted);font-size:13px}
.field{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.field input{flex:1 1 220px;font:inherit;font-weight:600;font-size:18px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.avatars{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.av2{width:78px;height:96px;border-radius:18px;border:1.5px solid var(--line);background:linear-gradient(#ffe6a8,#ffc2cf);cursor:pointer;padding:4px 0 0;overflow:hidden;display:flex;justify-content:center}
.av2 svg{height:150%;width:auto;margin-top:-2px}
.av2[aria-pressed="true"]{outline:3px solid var(--pink);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:1.2em;margin-top:6px}

/* forms list (kitchen) */
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.fcard{border:1.5px solid #3a0d17;border-radius:12px;padding:6px 10px;color:#2a0b12;font-size:clamp(11.5px,calc(.5vw + .7vh),14px);line-height:1.3}
.fcard b{display:block;font-size:15px}

/* dossier */
.dossier{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center}
.dossier .pic{width:110px;height:110px;border-radius:20px;border:1.5px solid var(--line);background:linear-gradient(#fff3c4,#ffd0dc);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.dossier .pic svg{height:92%;width:auto}
.dossier .pic svg+svg{margin-left:-22%}
.dossier h3{font-family:Unbounded,Raleway,sans-serif;font-size:clamp(18px,2.4vw,22px);margin:0 0 4px;color:var(--wine)}
.dossier dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 0;font-size:15.5px}
.dossier dt{color:var(--muted);font-weight:700}
.dossier dd{margin:0;font-weight:600}
.progress{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress h3{font-family:Unbounded,Raleway,sans-serif;margin:0;font-size:19px;color:var(--wine)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;color:var(--muted);font-weight:700;font-size:14px}
.prog{flex:1;max-width:240px;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--pink)}
.qcard{background:#8e1b2e!important;color:#fff!important;border-color:#3a0d17!important;font-size:clamp(15px,calc(.7vw + 1.1vh),20px);font-weight:700;line-height:1.35;background:var(--surface2);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;max-width:72ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.opts.col{grid-template-columns:1fr}
.opt{font-weight:700;text-align:left;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){background:var(--surface2)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.right::after{content:" ✓";color:var(--ok)}
.opt.wrong::after{content:" ✗";color:var(--bad)}
.recipe{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px;background:var(--surface)}

.recipe li{padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid transparent}
.recipe li.miss{background:var(--badbg);border-color:var(--bad)}
.recipe li.miss::after{content:" ↺";font-weight:800;color:var(--bad)}
.recipe li.ph{color:var(--muted);background:transparent;border:1px dashed var(--muted);min-width:40px;text-align:center}
.sum{text-align:center;padding:6px 0}
.sum .big{font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:clamp(30px,5vw,46px);color:var(--wine)}

.note{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;background:var(--surface2);font-size:15.5px}

.fbin{position:sticky;bottom:-16px;margin:12px -20px -16px;padding:10px 20px 14px;background:var(--surface);border-top:2px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center;animation:slideup .25s ease;z-index:3}
.fbin.ok{border-top-color:var(--ok)} .fbin.no{border-top-color:var(--bad)}
.fbin p{margin:0;font-size:15px;line-height:1.4;grid-column:1}
.fbin .verdict{grid-column:1}
.fbin .btn{grid-column:2;grid-row:1 / span 2}
@keyframes slideup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.verdict{font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:16px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}

.formpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.cert{border:2px solid var(--line);border-radius:20px;padding:14px 18px;background:
  radial-gradient(circle at 92% 12%,rgba(255,47,115,.2),transparent 40%),

.cert dd{margin:0;font-weight:700}
.rating{margin-top:10px;font-family:Unbounded,Raleway,sans-serif;font-weight:700;font-size:19px}
.vanart{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding:0 3% 1%;background:linear-gradient(#ffe2c8,#fbf4ef 70%)}
.vanart svg{height:94%;width:auto}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,8,14,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));z-index:50}
.modal[hidden]{display:none}

.sheet .top{padding:16px 20px 12px;border-bottom:1.5px solid var(--line);color:#2a0b12;border-radius:22px 22px 0 0;display:flex;gap:14px;align-items:center}

   {q:'Кто может быть участником полного товарищества?', opts:['Любые граждане','Только ИП и (или) коммерческие организации','Только некоммерческие организации','Только государство'], a:1, row:['Участники','только ИП и коммерческие организации'],
    why:'Ст. 69 ГК РФ: участниками полного товарищества могут быть только индивидуальные предприниматели и (или) коммерческие организации. Поэтому Маше и Даше и пригодился статус ИП.'},
   {q:'Из чего складывается капитал товарищества?', opts:['Уставный капитал из акций','Складочный капитал из вкладов участников','Паевой фонд','Уставный фонд от государства'], a:1, row:['Капитал','складочный'],
    why:'У хозяйственных товариществ — складочный капитал из вкладов участников. Прибыль и убытки делятся пропорционально долям в нём.'},
   {q:'Чем рискуют Маша и Даша, если у товарищества появятся долги?', opts:['Только своими вкладами','Всем своим имуществом — солидарно и субсидиарно','Ничем'], a:1, row:['Ответственность','солидарно и субсидиарно, всем имуществом'],
    why:'Ст. 75 ГК РФ: участники полного товарищества солидарно несут субсидиарную ответственность своим имуществом. Субсидиарная — дополнительная: сначала платит товарищество, не хватило — участники.'},
   {q:'На каком документе держится полное товарищество?', opts:['Устав','Учредительный договор','Соглашение об управлении'], a:1, row:['Документ','учредительный договор'],
    why:'Учредительный договор — только у хозяйственных товариществ (полного и на вере). Все остальные юрлица действуют на основании устава (ст. 52 ГК РФ).'},
   {q:'Товарищество не может вернуть поставщику 400 000 ₽. Поставщик требует всю сумму только с Даши. Законно?', opts:['Да: ответственность солидарная — можно требовать всё с любого участника','Нет: с Даши — только половину','Нет: требовать можно только с товарищества'], a:0,
    why:'Солидарная ответственность — кредитор вправе потребовать весь долг с любого из участников. Потом Даша сможет потребовать с Маши её часть.'},
   {q:'Маша уже участница товарищества «Маша, Даша и компания». Её зовут в ещё одно полное товарищество. Можно?', opts:['Да, хоть в десять','Да, если Даша согласится','Нет: лицо может быть участником только одного полного товарищества'], a:2,
    why:'Ст. 69 ГК РФ — абсолютный запрет: только одно полное товарищество, ведь участник отвечает по его долгам всем своим имуществом.'}
  ]},
 {id:'tv', guest:'Шеф Гриша и крёстная Нина', em:'💼',

   {q:'Из кого состоит товарищество на вере?', opts:['Только из вкладчиков','Из полных товарищей и вкладчиков-коммандитистов','Из акционеров','Из не менее 5 работающих членов'], a:1, row:['Состав','полные товарищи + вкладчики'],

    why:'Вкладчики несут риск убытков только в пределах внесённых вкладов.'},
   {q:'Чем рискует полный товарищ Гриша?', opts:['Только вкладом','Всем своим имуществом','Ничем'], a:1, row:['Риск полных товарищей','всё имущество'],
    why:'Полные товарищи в товариществе на вере отвечают так же, как в полном товариществе, — всем своим имуществом.'},

    why:'Вкладчик получает часть прибыли, но управлять не вправе — для того он и «верит» полным товарищам.'}

  ]},

function glossFor(seg){
  const low = seg.toLowerCase(); let best = null;

function rich(t){
  return String(t).split('**').map((seg, i) => {
    if (!(i % 2)) return seg;
    const m = glossFor(seg);
    if (!m) return `<b>${seg}</b>`;
    const at = seg.toLowerCase().indexOf(m.k);
    let st = at, en = at + m.k.length;
    while (en < seg.length && /[а-яё]/i.test(seg[en])) en++;   // слово целиком: «унитарн» → «унитарные»
    while (st > 0 && /[а-яё]/i.test(seg[st - 1])) st--;
    return `<b>${seg.slice(0, st)}</b><span class="term" tabindex="0" data-tip="${esc(m.g[0] + ' — ' + m.g[1].charAt(0).toLowerCase() + m.g[1].slice(1))}">${seg.slice(st, en)}</span><b>${seg.slice(en)}</b>`;

}

/* --- диалоги со стрелками --- */
function speakerHTML(w, who){
  if (w === 'c') return `<span class="speaker c">Шеф ${esc(S.n)}</span>`;

}
function dialog({ lines, idx, onIdx, onEnd, endLabel, extra }){
  const L = lines[idx];
  panel.innerHTML = `${speakerHTML(L.w, L.who)}<div class="say">${rich(L.t)}</div>${extra ? extra(L) : ''}
    <div class="nav"><button class="arrow back" id="prev" aria-label="Назад" ${idx===0?'disabled':''}>‹</button>
    <div class="dots" aria-hidden="true">${lines.map((_, i) => `<i class="${i<=idx?'on':''}"></i>`).join('')}</div>
    ${idx < lines.length - 1 ? `<button class="arrow" id="next" aria-label="Дальше">›</button>` : `<button class="btn" id="next">${endLabel}</button>`}</div>`;
  $('#prev').onclick = () => onIdx(idx - 1);
  $('#next').onclick = () => idx < lines.length - 1 ? onIdx(idx + 1) : onEnd();
}
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { const n = $('#next'); if (n && !n.disabled && n.classList.contains('arrow')) n.click(); }
  if (e.key === 'ArrowLeft') { const p = $('#prev'); if (p && !p.disabled) p.click(); }
});

        <div class="note ipnote"><span class="k">Важно: </span>ИП — не организация, а гражданин-предприниматель. Все остальные формы — коммерческие юридические лица.</div>` : '' });

    ${done ? '<div class="hint">Повторный разговор — для тренировки, звёзды за него не начисляются.</div>' : ''}`;

}

/* --- комната 3: разговор и тест --- */
function convoTalk(){
  const c = S.cur, id = c.id, st = ST(id), G = GUESTS[id];
  c.heard = c.heard || [];
  const t = c.topic ? G.topics[c.topic] : null;
  sceneConvo(id, 'g', false);
  const all = c.heard.length === COLS5.length;
  panel.innerHTML = `${t ? `<div class="ask">${speakerHTML('c')}<span>${rich(t[0])}</span></div>` : ''}
    ${speakerHTML('g', st.guest)}<div class="say">${rich(t ? t[1] : G.intro)}</div>
    <div class="menuq"><div class="mqh"><span>${all ? 'Всё узнали! Можно к вопросам — или переспроси:' : t ? 'Что ещё спросить?' : 'Что спросить?'}</span>
      <span class="dots5" aria-label="Узнано ${c.heard.length} из 5">${COLS5.map(([k]) => `<i class="${c.heard.includes(k) ? 'on' : ''}"></i>`).join('')}</span></div>
      <div class="qgrid">${COLS5.map(([k]) => `<button class="qbtn ${c.heard.includes(k) ? 'heard' : ''} ${c.topic === k ? 'cur' : ''}" data-k="${k}">${ASK[k]}</button>`).join('')}</div></div>
    <div class="row end"><button class="btn" id="toQuiz" ${all ? '' : 'disabled'}>${all ? 'К вопросам' : `К вопросам — узнай ещё ${COLS5.length - c.heard.length}`}</button></div>`;
  panel.querySelectorAll('.qbtn').forEach(b => b.onclick = () => { const k = b.dataset.k; c.topic = k; if (!c.heard.includes(k)) c.heard.push(k); save(); convoTalk(); panel.scrollTop = 0; });
  $('#toQuiz').onclick = () => { if (!all) return; c.phase = 'quiz'; c.qi = 0; c.ans = null; c.rows = []; c.got = 0; c.tries = 0; save(); rConvo(); };
}
function rConvo(){
  const c = S.cur, st = ST(c.id);
  room('У столика: ' + st.guest);
  if (c.phase === 'talk') convoTalk();
  else if (c.phase === 'quiz') convoQuiz();
  else convoRecipe();
}
function recipeCard(id, rows){
  const st = ST(id), f = F(id), total = st.items.filter(x => x.row).length;
  const ph = Array.from({length: Math.max(0, total - rows.length)}, () => '<li class="ph">?</li>').join('');
  return `<div class="recipe"><div class="rtop" style="background:${f.color}"><span aria-hidden="true">${f.emoji}</span><b>Рецепт: ${f.name}</b><span class="cnt">${rows.length}/${total}</span></div>
    <ul>${rows.map(r => `<li class="${r[2]?'':'miss'}"><b>${r[0]}:</b> ${r[1]}</li>`).join('')}${ph}</ul></div>`;
}
function convoQuiz(){
  const c = S.cur, id = c.id, st = ST(id), items = st.items, n = items.length, it = items[c.qi];
  if (c.tries == null) c.tries = 0;
  sceneConvo(id, 'g', true);
  const opts = it.opts, ord = (c.ord && c.ord[c.qi]) || opts.map((_, k) => k);
  panel.innerHTML = `${recipeCard(id, c.rows)}
    <div class="qtop"><span>${st.guest} · вопрос ${c.qi+1} из ${n}${c.tries ? ' · перерешиваем' : ''}</span><span class="prog"><i style="width:${c.qi/n*100}%"></i></span></div>
    <div class="qcard">${T(it.q)}</div>
    <div class="opts ${opts.some(x => x.length > 34) ? 'col' : ''}">${ord.map(k => `<button class="opt" data-k="${k}">${opts[k]}</button>`).join('')}</div>`;
  const finish = (k, fresh) => {
    const ok = k === it.a;
    panel.querySelectorAll('.opt').forEach(x => { const j = +x.dataset.k; x.disabled = true; if (ok && j === it.a) x.classList.add('right'); else if (j === k) x.classList.add('wrong'); });
    if (fresh) {
      const firstTry = c.tries === 0;
      if (firstTry && !c.replay) award(ok);
      if (ok) {
        if (it.row) c.rows.push([it.row[0], it.row[1], firstTry]);
        if (firstTry) c.got++;
        jump($('#cc'));
        panel.querySelector('.recipe').outerHTML = recipeCard(id, c.rows);
      } else { c.tries++; c.mist = true; }
      c.ans = k; save();
    }
    if (ok) showFB(true, it.why, c.qi < n - 1 ? 'Следующий вопрос' : 'Готово', () => {
      c.ans = null; c.tries = 0; c.qi++;
      if (c.qi >= n) c.phase = 'recipe';
      save(); rConvo();
    });
    else showFB(false, 'Давай напомню: ' + it.why, 'Перерешать вопрос', () => {
      c.ans = null; c.ord = c.ord || {}; c.ord[c.qi] = shuffled(opts.length);
      save(); rConvo();
    });
  };
  panel.querySelectorAll('.opt').forEach(b => b.onclick = () => finish(+b.dataset.k, true));
  if (c.ans != null) finish(c.ans, false);
  panel.scrollTop = 0;
}
function convoRecipe(){
  const c = S.cur, id = c.id, st = ST(id), f = F(id), n = st.items.length;
  sceneConvo(id, 'g', false);
  if (c.first == null) { c.first = c.got; save(); }
  if (!c.replay && !S.done.includes(id)) { S.done.push(id); S.scores[id] = [c.first, n, c.attempt]; save(); }
  jump($('#cc'));
  panel.innerHTML = `<div class="sum"><div class="big">${c.replay ? `✓ ${c.got} из ${n}` : '🎉 Рецепт собран'}</div>
    <p>Рецепт «${f.name}» добавлен в Книгу рецептов. ${c.got === n ? 'С первой попытки — ни одной ошибки!' : `Все ответы верные. С первой попытки — ${c.got} из ${n}: звёзды начисляются только за них.`}${ORDER.indexOf(id) < ORDER.length - 1 && !c.replay ? ' Следующий столик открыт!' : ''}</p></div>
    ${recipeCard(id, c.rows)}
    <div class="note"><span class="k">❗ Ловушка ЕГЭ: </span>${f.trap}</div>
    <div class="row end"><button class="btn ghost" id="card">Полная карточка</button><button class="btn" id="hall">Вернуться в зал</button></div>`;
  $('#bookBtn').hidden = false;
  $('#card').onclick = () => openModal(() => formSheet(id));
  $('#hall').onclick = () => { S.cur = null; S.sel = null; go('hall'); };
}

/* --- финал: снова кухня --- */
function rFinal(){
  const fz = S.fin;
  room('Снова на кухне');
  if (fz.phase === 'talk') {
    const lines = KITCHEN2.map(([w, t]) => ({ w, t }));
    const show = i => { fz.i = i; save(); sceneKitchen(lines[i].w); dialog({ lines, idx:i, onIdx:show, onEnd:() => { fz.phase = 'check'; fz.ci = 0; fz.ans = null; save(); rFinal(); }, endLabel:'Давай вопросы' }); };
    show(Math.min(fz.i || 0, lines.length - 1));
  } else if (fz.phase === 'check') finalCheck();
  else if (fz.phase === 'pros') finalPros();
  else if (fz.phase === 'van') finalVan();
  else if (fz.phase === 'doc') finalDoc();
}
function finalCheck(){
  const fz = S.fin, row = CHECK[fz.ci];
  sceneKitchen('c'); stage.classList.add('compact');
  const left = FORMS.filter(f => !fz.crossed.includes(f.id));
  panel.innerHTML = `<div class="qtop"><span>Разговор с Марком · ${fz.ci+1} из ${CHECK.length}</span><span class="prog"><i style="width:${fz.ci/CHECK.length*100}%"></i></span></div>
    <div class="ask">${speakerHTML('w')}<span>${row[0]}</span></div>
    <div class="ask me">${speakerHTML('c')}<span>${row[1]}</span></div>
    <div class="ask">${speakerHTML('w')}<span><b>Тогда какая форма тебе точно не подойдёт?</b></span></div>
    <div class="formpick">${FORMS.map(f => `<button class="fp ${fz.crossed.includes(f.id)?'gone':''}" data-id="${f.id}" style="background:${f.color}" ${fz.crossed.includes(f.id)?'disabled':''}>${f.emoji} ${f.short}</button>`).join('')}</div>`;
  const answer = (id, freshTry) => {
    const ok = id === row[2];
    const b = panel.querySelector(`.fp[data-id="${id}"]`);
    if (!ok) {
      b.classList.add('wrong');
      if (freshTry && fz.first !== false) { fz.first = false; award(false); save(); }
      showFB(false, `Эта форма тебе ещё может подойти. Подумай, что исключает ответ «${row[1]}».`, 'Подумать ещё', () => { b.classList.remove('wrong'); });
      return;
    }
    panel.querySelectorAll('.fp').forEach(x => x.disabled = true);
    b.classList.add('right');
    if (freshTry) { if (fz.first !== false) award(true); fz.ans = id; save(); }
    showFB(true, row[3], fz.ci < CHECK.length - 1 ? 'Следующий вопрос Марка' : 'Что осталось?', () => {
      fz.crossed.push(row[2]); fz.ci++; fz.ans = null; fz.first = true;
      if (fz.ci >= CHECK.length) fz.phase = 'pros';
      save(); rFinal();
    });
  };
  panel.querySelectorAll('.fp:not(:disabled)').forEach(b => b.onclick = () => answer(b.dataset.id, true));
  if (fz.ans) answer(fz.ans, false);
}
function finalPros(){
  sceneKitchen('w'); stage.classList.add('compact');
  const n = esc(S.n);
  panel.innerHTML = `${speakerHTML('w')}<div class="say">Остались две формы. У каждой свои плюсы и минусы — выбирай!</div>
    <div class="choice">
      <div class="ccard y"><h4>ООО</h4><div class="lbl">Плюсы</div><ul><li>Личное имущество защищено: рискуете только долями.</li><li>Не нужно сначала становиться ИП.</li></ul>
        <div class="lbl">Минусы</div><ul><li>Нужны устав и уставный капитал от 10 000 ₽.</li><li>Вложенные в доли деньги могут пропасть.</li></ul>
        <div class="row"><button class="btn" data-c="ooo">Выбираю ООО</button></div></div>
      <div class="ccard"><h4>Полное товарищество</h4><div class="lbl">Плюсы</div><ul><li>Высокое доверие поставщиков и банков.</li><li>Решения — вместе, по общему согласию.</li></ul>
        <div class="lbl">Минусы</div><ul><li>Отвечаете всем имуществом — солидарно и субсидиарно.</li><li>Сначала обоим нужно стать ИП.</li></ul>
        <div class="row"><button class="btn" data-c="pt">Выбираю товарищество</button></div></div>
    </div>`;
  panel.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.fin.choice = b.dataset.c; S.fin.phase = S.fin.choice === 'ooo' ? 'van' : 'doc'; save(); rFinal(); });
}
function finalVan(){
  sceneKitchen('w');
  panel.innerHTML = `${speakerHTML('w')}<div class="say">Отличный выбор! Как назовём фургон? Это название будет в наименовании ООО.</div>
    <div class="field"><input id="vn" maxlength="32" placeholder="Например, Хот-дог на колёсах" autocomplete="off" aria-label="Название фургона" value="${esc(S.fin.van || '')}"></div><div class="err" id="er"></div>
    <div class="row end"><button class="btn" id="ok">Записать название</button></div>`;
  const ok = () => { const v = $('#vn').value.trim().replace(/[«»"]/g, ''); if (!v) { $('#er').textContent = 'Придумай название — без вывески никуда.'; return; } S.fin.van = v; S.fin.phase = 'doc'; save(); rFinal(); };
  $('#ok').onclick = ok; $('#vn').addEventListener('keydown', e => { if (e.key === 'Enter') ok(); }); $('#vn').focus();
}
function finalDoc(){
  const fz = S.fin, right = fz.choice === 'ooo' ? 0 : 1;
  sceneKitchen('w'); stage.classList.add('compact');
  const opts = ['Устав', 'Учредительный договор', 'Никакого — только регистрация как ИП'];
  panel.innerHTML = `${speakerHTML('w')}<div class="say">Последний шаг перед регистрацией: какой учредительный документ приложим к заявлению?</div>
    <div class="opts col">${opts.map((o,k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
  const ans = (k, fresh) => {
    const ok = k === right;
    panel.querySelectorAll('.opt').forEach((x, j) => { x.disabled = true; if (j === right) x.classList.add('right'); else if (j === k) x.classList.add('wrong'); });
    if (fresh) { award(ok); fz.ans = k; save(); }
    showFB(ok, right === 0 ? 'ООО, как и все юрлица, кроме хозяйственных товариществ, действует на основании устава (ст. 52 ГК РФ).' : 'Полное товарищество — хозяйственное товарищество, а значит его документ — учредительный договор (ст. 52 ГК РФ).', 'Открыть дело!', () => { fz.ans = null; go('done'); });
  };
  panel.querySelectorAll('.opt').forEach(b => b.onclick = () => ans(+b.dataset.k, true));
  if (fz.ans != null) ans(fz.ans, false);
}
function rDone(){
  room('Дело открыто');
  const fz = S.fin, n = esc(S.n), isO = fz.choice === 'ooo';
  stage.className = 'stage' + (innerHeight < 760 ? ' compact' : '');
  stage.innerHTML = `<div class="vanart"><span style="height:80%;display:flex;align-items:flex-end">${WAITER.replace('<svg ', '<svg style="height:100%;width:auto" ')}</span>${VAN}<span style="height:80%;display:flex;align-items:flex-end" id="cc">${playerSVG(S.av).replace('<svg ', '<svg style="height:100%;width:auto" ')}</span></div>`;
  confetti();
  const r = S.max ? (S.right || 0) / S.max : 0;
  const level = r >= .9 ? 'Фургон с очередью до угла' : r >= .75 ? 'Хот-доги расходятся бойко' : r >= .5 ? 'Первые покупатели уже есть' : 'Фургон пока на стоянке — есть куда расти';
  panel.innerHTML = `<div class="cert">
    <h2>Дело открыто, шеф ${n}!</h2>
    <div class="sub">Фургон с хот-догами зарегистрирован${isO ? ' как ООО' : ' как полное товарищество'} и выезжает на улицы.</div>
    <dl>
      <dt>Наименование</dt><dd>${isO ? `ООО «${esc(fz.van)}»` : `Полное товарищество «${n}, Марк и компания»`}</dd>
      <dt>Документ</dt><dd>${isO ? 'устав, уставный капитал от 10 000 ₽' : 'учредительный договор; оба — ИП'}</dd>
      <dt>По долгам</dt><dd>${isO ? 'рискуют только стоимостью своих долей' : 'всем имуществом — солидарно и субсидиарно'}</dd>
    </dl>
    <div class="rating">⭐ ${S.stars} — ${level}</div><div class="sub">Верно с первого раза: ${S.right || 0} из ${S.max} · лучшая серия: 🔥 ${S.best || 0}</div></div>
    <div class="row end"><button class="btn ghost" id="slotsD">🎰 Тренажёр</button><button class="btn ghost" id="book">📖 Книга рецептов</button><button class="btn" id="again">Сыграть ещё раз</button></div>`;
  $('#book').onclick = () => openModal(bookSheet);
  $('#slotsD').onclick = () => openSlots();
  $('#again').onclick = () => { wipe(); S = fresh(); go('name'); };
}

/* ===================== тренажёр «Автомат ситуаций» ===================== */
// [кто, деньги, что важно, верная форма, почему]
const SCEN = [
  ['Я один','Свои деньги','Без организации — попроще','ip','Один человек без организации — это ИП. Но по долгам придётся отвечать всем имуществом.'],
  ['Я один','Свои деньги','Сохранить квартирку','ooo','ООО можно открыть и одному, а риск — только в пределах своей доли.'],
  ['Нас двое, оба ИП','Свои деньги','Доверие банков — отвечаем всем','pt','Только ИП, ответственность всем имуществом и решения по общему согласию — полное товарищество.'],
  ['Нас трое','Свои деньги','Сохранить квартирку','ooo','Несколько участников (до 50) и риск только долями — ООО.'],
  ['Я веду дела','Инвестор: даёт деньги, не управляет','Я отвечаю всем, инвестор — вкладом','tv','Полный товарищ плюс вкладчик-коммандитист — товарищество на вере.'],
  ['Нас двое','Ещё два инвестора, не управляют','Мы отвечаем всем','tv','Полные товарищи плюс вкладчики, которые не управляют, — товарищество на вере.'],
  ['Сотни акционеров','Акции на бирже','Рискуем только акциями','ao','Публичное размещение акций на бирже — это ПАО.'],
  ['60 партнёров','Свои деньги','Сохранить квартирку','ao','В ООО не больше 50 участников. Для шестидесяти партнёров без риска для квартир подойдёт АО.'],
  ['Я один','Свои деньги','Продать акции на бирже','ao','Акции бывают только у акционерного общества — его можно создать и одному.'],
  ['Нас 7, все у печи','Паевые взносы','Голос поровну, прибыль по труду','pk','Не менее 5 человек с личным трудом, паи и «один член — один голос» — производственный кооператив.'],
  ['Семья фермеров','Вклады членов','Выращивать овощи','kfh','Совместное сельское хозяйство с личным трудом — крестьянское (фермерское) хозяйство.'],
  ['Город','Уставный фонд от города','Кормить школьников','gup','Создаёт муниципалитет, имущество неделимо и в хозяйственном ведении — МУП.'],
  ['Регион (субъект РФ)','Уставный фонд от региона','Чинить дороги','gup','Унитарное предприятие субъекта РФ — это ГУП.'],
  ['Трое изобретателей','Вклады + гибкое соглашение','Реклама не нужна','hp','Гибкое соглашение об управлении и запрет рекламы — хозяйственное партнёрство.']
];
const REELS = [['Я один','Нас двое','Нас трое','Город','Семья фермеров','Сотни акционеров','Нас 7, все у печи','Регион (субъект РФ)'],
               ['Свои деньги','Акции на бирже','Паевые взносы','Инвестор без управления','Уставный фонд','Вклады членов'],
               ['Сохранить квартирку','Выращивать овощи','Реклама не нужна','Отвечаем всем','Кормить школьников','Без организации']];
let spinning = false;
function openSlots(){ S.slots = S.slots || { right:0, total:0 }; S.back = S.screen; S.screen = 'slots'; S.slotCur = null; save(); render(); }
function slotMachine(vals){
  return `<div class="slots"><div class="cab"><div class="sl-title">🎰 Автомат ситуаций</div>
    <div class="reels">${['Кто','Деньги','Что важно'].map((h, i) => `<div class="reel"><small>${h}</small><b id="rl${i}">${vals ? vals[i] : '?'}</b></div>`).join('')}</div>
    <div class="sl-foot">Верно: ${S.slots.right} из ${S.slots.total}</div></div>
    <button class="lever" id="lever" aria-label="Дёрнуть рычаг"><i></i></button></div>`;
}
function rSlots(){
  S.slots = S.slots || { right:0, total:0 };
  room('Тренажёр');
  hideTip();
  const cur = S.slotCur != null ? SCEN[S.slotCur] : null;
  stage.className = 'stage slotstage';
  stage.innerHTML = slotMachine(cur);
  const backLbl = S.back === 'done' ? 'К свидетельству' : 'Вернуться в зал';
  if (!cur) {
    panel.innerHTML = `${speakerHTML('w')}<div class="say">Это автомат ситуаций! Дёрни рычаг — он выдаст план бизнеса: кто открывает, откуда деньги и что важно. А ты скажи, какая форма подойдёт. Тренируйся сколько хочешь — к финальному выбору будешь готов на все сто.</div>
      <div class="row end"><button class="btn ghost" id="sback">${backLbl}</button><button class="btn" id="spin">🎰 Крутить!</button></div>`;
  } else {
    panel.innerHTML = `<div class="qcard">Какая форма подойдёт для этого плана?</div>
      <div class="formpick">${FORMS.map(f => `<button class="fp" data-id="${f.id}" style="background:${f.color}">${f.emoji} ${f.short}</button>`).join('')}</div>
      <div class="row end"><button class="btn ghost" id="sback">${backLbl}</button><button class="btn ghost" id="spin">🎰 Другая ситуация</button></div>`;
    panel.querySelectorAll('.fp').forEach(b => b.onclick = () => {
      const ok = b.dataset.id === cur[3];
      if (S.slotTried !== S.slotCur) { S.slots.total++; if (ok) S.slots.right++; S.slotTried = S.slotCur; save(); }
      panel.querySelectorAll('.fp').forEach(x => { x.disabled = true; if (ok && x === b) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      if (ok) { popStar('🎉'); $('.sl-foot').textContent = `Верно: ${S.slots.right} из ${S.slots.total}`; }
      showFB(ok, ok ? cur[4] : 'Давай подумаем ещё. Посмотри на все три барабана: кто, откуда деньги и что важно.', ok ? 'Крутить ещё' : 'Попробовать ещё', () => {
        if (ok) spin(); else panel.querySelectorAll('.fp').forEach(x => { x.disabled = false; x.classList.remove('wrong'); });
      });
    });
  }
  $('#spin').onclick = spin;
  $('#lever').onclick = spin;
  $('#sback').onclick = () => { S.screen = S.back || 'hall'; S.slotCur = null; save(); render(); };
}
function spin(){
  if (spinning) return;
  spinning = true; hideFB();
  let next; do { next = Math.floor(Math.random() * SCEN.length); } while (next === S.slotCur && SCEN.length > 1);
  const target = SCEN[next];
  $('#lever').classList.add('pull'); setTimeout(() => { const l = $('#lever'); if (l) l.classList.remove('pull'); }, 500);
  const stops = [700, 1050, 1400], t0 = Date.now();
  [0, 1, 2].forEach(i => $('#rl' + i).parentElement.classList.add('spin'));
  const tick = setInterval(() => {
    const dt = Date.now() - t0;
    [0, 1, 2].forEach(i => {
      const el = $('#rl' + i); if (!el) return;
      if (dt < stops[i]) el.textContent = pick(REELS[i]);
      else { el.textContent = target[i]; el.parentElement.classList.remove('spin'); }
    });
    if (dt >= stops[2]) {
      clearInterval(tick); spinning = false;
      S.slotCur = next; save();
      setTimeout(rSlots, 250);
    }
  }, 70);
}

/* ===================== книга рецептов ===================== */
const modal = $('#modal'), sheet = $('#sheet');
let lastFocus = null;
function openModal(fn){ lastFocus = document.activeElement; fn(); modal.hidden = false; const c = $('#mClose'); if (c) c.focus(); }
function closeModal(){ modal.hidden = true; if (lastFocus) lastFocus.focus(); }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function formSheet(id, back){
  const f = F(id);
  sheet.innerHTML = `<div class="top" style="background:${f.color}"><span class="em" aria-hidden="true">${f.emoji}</span><div><small>${f.kind}</small><h3>${f.name}</h3></div><button class="close" id="mClose" aria-label="Закрыть">✕</button></div>
   <div class="body"><table class="facts">${f.rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>
   <div class="note"><span class="k">🍳 На кухне это как: </span>${f.kitchen}</div>
   <div class="note"><span class="k">❗ Ловушка ЕГЭ: </span>${f.trap}</div>
   <div class="law">${f.law}</div>
   <div class="row end">${back ? '<button class="btn ghost" id="mBack">Ко всей книге</button>' : ''}<button class="btn" id="mOk">Понятно</button></div></div>`;
  $('#mClose').onclick = closeModal; $('#mOk').onclick = closeModal;
  if (back) $('#mBack').onclick = bookSheet;
}
function bookSheet(){
  sheet.innerHTML = `<div class="top" style="background:#ffd0dc"><span class="em" aria-hidden="true">📖</span><div><small>Собрано рецептов: ${S.done.length} из 9</small><h3>Книга рецептов</h3></div><button class="close" id="mClose" aria-label="Закрыть">✕</button></div>
   <div class="body"><div class="bookgrid">${FORMS.map(f => { const has = S.done.includes(f.id);
     return `<button class="dish" data-id="${f.id}" style="background:${f.color}" ${has?'':'disabled'}><span class="em" aria-hidden="true">${has ? f.emoji : '🔒'}</span><span class="sh">${f.short}</span><span class="nm">${has ? f.name : 'Расспроси гостя: ' + ST(f.id).guest}</span></button>`; }).join('')}</div>
   <div class="note"><span class="k">📜 Правило ст. 52 ГК РФ: </span>учредительный договор — только у хозяйственных товариществ (полного и на вере). Остальные юрлица действуют на основании устава.</div></div>`;
  $('#mClose').onclick = closeModal;
  sheet.querySelectorAll('.dish:not(:disabled)').forEach(b => b.onclick = () => formSheet(b.dataset.id, true));
}
$('#bookBtn').onclick = () => openModal(bookSheet);
function glossSheet(){
  const list = GLOSS.slice().sort((a, b) => a[0].localeCompare(b[0], 'ru'));
  sheet.innerHTML = `<div class="top" style="background:#fff3c4"><span class="em" aria-hidden="true">📘</span><div><small>Все трудные слова из разговоров</small><h3>Словарик шефа</h3></div><button class="close" id="mClose" aria-label="Закрыть">✕</button></div>
   <div class="body"><dl class="gloss">${list.map(g => `<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></div>`;
  $('#mClose').onclick = closeModal;
}
$('#glossBtn').onclick = () => { hideTip(); openModal(glossSheet); };
$('#menuBtn').onclick = () => { save(); S.screen === 'title' ? null : (hideFB(), rTitleFromMenu()); };
function rTitleFromMenu(){ const keep = S; save(); S = fresh(); S.screen = 'title'; rTitle(); S = keep; $('#menuBtn').hidden = true; $('#bookBtn').hidden = true; $('#glossBtn').hidden = true; }

/* ===================== старт ===================== */
rTitle();
</script>
